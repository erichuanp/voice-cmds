name: voice-cmds
channels:
  - conda-forge
dependencies:
  - python=3.11
  - pip
  - pip:
      - PySide6>=6.6
      - sounddevice
      - soundfile
      - numpy
      - sherpa-onnx
      - onnxruntime            # CPU-only: embedder runs CPU inference
      - tokenizers
      - pypinyin
      - keyboard
      - pywin32
      - requests
      - tqdm
