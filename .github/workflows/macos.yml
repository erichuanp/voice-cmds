name: macOS build & test

on:
  push:
    branches: [macos]
  workflow_dispatch:

jobs:
  test-build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Both real (arm64) and Intel (x86_64 under Rosetta 2 on the arm64
          # runner — GitHub's native Intel macOS runners are being sunset).
          - os: macos-14
            arch: arm64
            pyarch: arm64
          - os: macos-14
            arch: x86_64
            pyarch: x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          architecture: ${{ matrix.pyarch }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r mac-requirements.txt

      - name: Unit tests (offscreen)
        run: python -m pytest tests -q

      - name: Selftest (source)
        run: python main.py --selftest

      - name: Build with PyInstaller
        run: pyinstaller voice-cmds.spec --noconfirm

      - name: Selftest (frozen)
        run: ./dist/voice-cmds/voice-cmds --selftest

      - name: Package release (manifest + zip)
        run: python build_release.py --suffix=macos-${{ matrix.arch }}

      - uses: actions/upload-artifact@v4
        with:
          name: voice-cmds-${{ matrix.os }}
          path: |
            release/*.zip
            release/manifest.json
